name: publish-plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-plugin:
    runs-on: ubuntu-latest
    env:
      WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Publish private plugin to Windy
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WINDY_API_KEY:-}" ]]; then
            echo "GitHub Actions secret WINDY_API_KEY is not configured" >&2
            exit 1
          fi

          cd dist
          for required_file in plugin.min.js plugin.json package.json; do
            if [[ ! -s "$required_file" ]]; then
              echo "Required publish file is missing or empty: $required_file" >&2
              exit 1
            fi
          done

          if ! jq -e '.author | type == "string" and length >= 5' plugin.json >/dev/null; then
            echo "Windy requires plugin author to contain at least 5 characters" >&2
            exit 1
          fi

          jq --arg repositoryName "$GITHUB_REPOSITORY" \
             --arg commitSha "$GITHUB_SHA" \
             --arg repositoryOwner "$GITHUB_REPOSITORY_OWNER" \
             '. + {repositoryName: $repositoryName, commitSha: $commitSha, repositoryOwner: $repositoryOwner}' \
             plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugin.json
          # Windy serves the minified bundle; omit the development bundle and source maps.
          tar -cf ../plugin.tar plugin.min.js plugin.json package.json
          ls -lh ../plugin.tar

          curl --silent --show-error --fail-with-body \
            -X POST 'https://node.windy.com/plugins/v1.0/upload' \
            -H "x-windy-api-key: ${WINDY_API_KEY}" \
            -F 'plugin_archive=@../plugin.tar'
